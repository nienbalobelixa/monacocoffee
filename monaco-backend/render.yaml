services:
  # Backend API (NestJS on Render.com)
  - type: web
    name: monaco-backend
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: monaco-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        sync: false  # Set manually to your Vercel URL

  # PostgreSQL Database (Supabase preferred, or Render's Postgres)
  # If using Render's Postgres:
databases:
  - name: monaco-db
    plan: free
    databaseName: monaco_coffee
    user: monaco_user
